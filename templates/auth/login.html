<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TrashFormer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
:root {
  --primary: #38BDF8; /* Lighter, vibrant accent blue */
  --primary-dark: #1E88E5;
  --eco-green: #10B981; /* Eco-friendly green */
  --eco-green-light: #34D399; /* Lighter green variant */
  --bg-dark: #020617; /* Dark neutral background */
  --bg-light: #0F172A; /* Slightly lighter background */
  --card-bg: #0F172A;
  --border-color: rgba(56, 189, 248, 0.2); /* Matches primary */
  --text-primary: #E2E8F0; /* Soft white */
  --text-secondary: #64748B; /* Softer gray */
  --radius: 10px; /* Larger radius */
  --transition: all 0.3s ease-in-out; /* Smooth transition */
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  opacity: 0.3;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 2rem;
  width: 100%;
}

.auth-container {
  max-width: 440px;
  width: 100%;
  background: rgba(2, 6, 23, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 3rem 2.5rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
  position: relative;
  transition: var(--transition);
}

.auth-container:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  border-color: var(--primary);
}

.auth-header {
  text-align: center;
  margin-bottom: 2.5rem;
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--text-primary);
  text-decoration: none;
  margin-bottom: 1.5rem;
}

.logo-icon {
  color: var(--bg-dark);
  background: linear-gradient(135deg, var(--primary) 0%, var(--eco-green) 100%);
  width: 48px;
  height: 48px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
  transition: var(--transition);
  font-size: 1.5rem;
}

.logo:hover .logo-icon {
  transform: rotate(10deg) scale(1.1);
  box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
}

.auth-header h1 {
  font-size: 2rem;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  color: var(--text-primary);
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
  margin-bottom: 0.5rem;
}

.auth-header p {
  color: var(--text-secondary);
  font-size: 1.1rem;
  font-weight: 500;
}

.user-type-toggle {
  display: flex;
  background: rgba(15, 23, 42, 0.5);
  border-radius: var(--radius);
  padding: 6px;
  margin-bottom: 2rem;
  gap: 0.5rem;
  border: 1px solid var(--border-color);
}

.user-type-toggle input[type="radio"] {
  display: none;
}

.user-type-toggle label {
  flex: 1;
  text-align: center;
  padding: 0.8rem 1rem;
  cursor: pointer;
  border-radius: 8px;
  font-weight: 600;
  color: var(--text-secondary);
  transition: var(--transition);
  background: transparent;
}

.user-type-toggle input[type="radio"]:checked + label {
  background: linear-gradient(135deg, var(--primary) 0%, var(--eco-green) 100%);
  color: var(--bg-dark);
  box-shadow: var(--shadow-md);
}

.user-type-toggle label:hover {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.75rem;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 1rem;
}

.form-group input {
  width: 100%;
  padding: 0.9rem 1.25rem;
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  font-size: 1rem;
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
  font-family: inherit;
  font-weight: 500;
  transition: var(--transition);
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  background: rgba(255, 255, 255, 0.2);
}

.btn-primary {
  width: 100%;
  padding: 1rem 0;
  margin-top: 1rem;
  background: linear-gradient(to right, var(--primary-dark) 0%, var(--primary) 100%);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow-md);
  font-family: 'Plus Jakarta Sans', sans-serif;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.error-message {
  background: rgba(211, 47, 47, 0.1);
  border: 1px solid rgba(211, 47, 47, 0.3);
  color: #D32F2F;
  padding: 1rem 1.25rem;
  border-radius: var(--radius);
  margin-bottom: 1.5rem;
  font-size: 1rem;
  text-align: center;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.error-message::before {
  content: '⚠';
  font-size: 1.2rem;
}

.auth-footer {
  text-align: center;
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border-color);
  color: var(--text-secondary);
}

.auth-footer p {
  margin-bottom: 0.75rem;
}

.auth-footer a {
  color: var(--eco-green);
  text-decoration: none;
  font-weight: 600;
  transition: var(--transition);
}

.auth-footer a:hover {
  color: var(--eco-green-light);
  text-decoration: underline;
}

/* Responsive Design */
@media (max-width: 768px) {
  .container {
    padding: 1rem;
  }
  
  .auth-container {
    padding: 2.5rem 2rem;
    margin: 1rem;
  }
  
  .auth-header h1 {
    font-size: 1.75rem;
  }
  
  .logo {
    font-size: 1.5rem;
  }
  
  .logo-icon {
    width: 42px;
    height: 42px;
    font-size: 1.25rem;
  }
  
  .form-group input {
    padding: 0.9rem 1rem;
  }
}
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-recycle"></i>
                    </div>
                    <span>TrashFormer</span>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to your account</p>
            </div>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/auth/login">
                <div class="user-type-toggle">
                    <input type="radio" id="user" name="user_type" value="user" checked>
                    <label for="user">User</label>
                    <input type="radio" id="vendor" name="user_type" value="vendor">
                    <label for="vendor">Vendor</label>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/auth/signup">Sign up</a></p>
                <p><a href="/">Back to Home</a></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particlesArray = [];

            const colors = [
                'rgba(56, 189, 248, 0.5)', // blue
                'rgba(16, 185, 129, 0.5)', // green
                'rgba(96, 165, 250, 0.5)', // light blue
                'rgba(52, 211, 153, 0.5)'  // light green
            ];

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * 1 - 0.5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    
                    if (this.x > canvas.width || this.x < 0) {
                        this.speedX = -this.speedX;
                    }
                    if (this.y > canvas.height || this.y < 0) {
                        this.speedY = -this.speedY;
                    }
                }
                
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            function init() {
                particlesArray = [];
                const numberOfParticles = (canvas.height * canvas.width) / 9000;
                
                for (let i = 0; i < numberOfParticles; i++) {
                    particlesArray.push(new Particle());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let i = 0; i < particlesArray.length; i++) {
                    particlesArray[i].update();
                    particlesArray[i].draw();
                    
                    for (let j = i; j < particlesArray.length; j++) {
                        const dx = particlesArray[i].x - particlesArray[j].x;
                        const dy = particlesArray[i].y - particlesArray[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 100) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - distance/1000})`;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                            ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                            ctx.stroke();
                        }
                    }
                }
                
                requestAnimationFrame(animate);
            }
            
            window.addEventListener('resize', () => {
                canvas.width = innerWidth;
                canvas.height = innerHeight;
                init();
            });

            init();
            animate();

            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.style.transform = 'translateZ(8px)';
                });
                
                input.addEventListener('blur', () => {
                    input.style.transform = 'translateZ(0px)';
                });
            });
        });
    </script>
</body>
</html>
